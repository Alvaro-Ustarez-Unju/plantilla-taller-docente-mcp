name: GitHub Classroom Autograding - TP 4 DEMO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  evaluacion-autograding:
    name: Autograding Demo Tests - TP4
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar utilitarios del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coreutils bsdmainutils

      - name: Configurar Permisos de Ejecución
        run: |
          chmod +x test_demo.sh demo_ejercicios.sh

      - name: Ejecutar Suite de Evaluación de TP4 Demo
        run: |
          ./test_demo.sh

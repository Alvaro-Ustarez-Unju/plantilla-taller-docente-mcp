<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 850px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 15px; background: #f4f6f9; padding: 20px; border-radius: 12px;">

    <h4 style="margin: 0; padding: 12px; background: #d1e7dd; color: #0f5132; text-align: center; border-bottom: 1px solid #badbcc;">
      OR ( || ) <br><small style="font-weight: normal; font-size: 0.85rem;">Al menos una debe cumplirse</small>
    </h4>
    <table style="width: 100%; text-align: center; border-collapse: collapse;">
      <tr style="background: #f8f9fa; color: #495057; font-size: 0.9rem;">
        <th style="padding: 8px;">Cond. 1</th><th style="padding: 8px;">Cond. 2</th><th style="padding: 8px;">Resultado</th>
      </tr>

    <table style="width: 100%; text-align: center; border-collapse: collapse;">
      <tr style="background: #f8f9fa; color: #495057; font-size: 0.9rem;">

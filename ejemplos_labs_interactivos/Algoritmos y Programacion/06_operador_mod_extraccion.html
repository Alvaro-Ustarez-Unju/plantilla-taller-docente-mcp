<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Módulo: Extracción y Formato</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #282a36;
            --text-color: #f8f8f2;
            --accent: #bd93f9;
            --border: #44475a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: var(--accent);
            margin-top: 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: rgba(0,0,0,0.2);
            border-radius: 6px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: #282a36;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .resultado {
            margin-top: 15px;
            padding: 10px;
            background-color: var(--bg-color);
            border-left: 4px solid var(--accent);
            font-family: monospace;
            font-size: 1.1rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>El Poder del Módulo (%)</h2>

        <div class="section">
            <label for="inputFecha">Caso 1: Fecha (YYYYMMDD)</label>
            <input type="number" id="inputFecha" value="20260414" placeholder="Ej: 20260414">
            <button onclick="descomponerFecha()">Extraer Datos</button>
            <div id="resFecha" class="resultado">Esperando acción...</div>
        </div>

        <div class="section">
            <label for="inputDecimal">Caso 2: Número Real (Muchos decimales)</label>
            <input type="number" id="inputDecimal" value="314.159265" step="any" placeholder="Ej: 314.159265">
            <button onclick="formatearDecimales()">Formatear a 2 Decimales</button>
            <div id="resDecimal" class="resultado">Esperando acción...</div>
        </div>
    </div>

    <script>
        // --- Caso 1: Lógica para descomponer la fecha ---
        function descomponerFecha() {
            // Obtenemos el valor como número entero
            const fecha = parseInt(document.getElementById('inputFecha').value);
            
            if (isNaN(fecha)) return;

            // En JavaScript usamos Math.trunc() como el equivalente a TRUNC de PSeInt
            const dia = fecha % 100;
            const mes = Math.trunc(fecha / 100) % 100;
            const anio = Math.trunc(fecha / 10000);

            const display = `Año: ${anio} | Mes: ${mes} | Día: ${dia}`;
            document.getElementById('resFecha').innerText = display;
        }

        // --- Caso 2: Lógica para extraer decimales matemáticamente ---
        function formatearDecimales() {
            // Obtenemos el valor como número de punto flotante
            const numeroOriginal = parseFloat(document.getElementById('inputDecimal').value);
            
            if (isNaN(numeroOriginal)) return;

            // 1. Extraer la parte entera
            const parteEntera = Math.trunc(numeroOriginal);
            
            // 2. Desplazar la coma, truncar y aplicar módulo
            // Nota: Se usa Math.abs() en el módulo por si el número es negativo
            const decimalesExtraidos = Math.abs(Math.trunc(numeroOriginal * 100)) % 100;

            // Formatear para que si el decimal es menor a 10, le agregue un '0' adelante (ej: .05)
            const decimalFormateado = decimalesExtraidos.toString().padStart(2, '0');

            const display = `Visualización: ${parteEntera}.${decimalFormateado}`;
            document.getElementById('resDecimal').innerText = display;
        }
    </script>
</body>
</html>

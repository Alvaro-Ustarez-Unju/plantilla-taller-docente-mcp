<div id="app-container" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #dee2e6;">
    
    <div style="background: #003366; color: white; padding: 20px; text-align: center;">
        <h3 style="margin: 0; font-size: 1.3rem; font-weight: 600;">Laboratorio: Linealización de Expresiones</h3>
        <p style="margin: 5px 0 0 0; font-size: 0.9rem; color: #cbd5e1;">Traduce la fórmula matemática al formato estricto de PSeInt.</p>
    </div>

    <div style="padding: 30px; background-color: #f8f9fa; display: flex; flex-direction: column; align-items: center;">
        
        <div style="background: white; width: 100%; border: 1px solid #dee2e6; border-radius: 8px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
            <span style="font-size: 0.85rem; font-weight: bold; color: #6c757d; text-transform: uppercase; letter-spacing: 1px;">Expresión en Papel</span>
            <div id="formula-display" style="margin-top: 15px; min-height: 60px; display: flex; justify-content: center; align-items: center;">
                </div>
        </div>

        <div style="width: 100%; position: relative;">
            <label style="font-size: 0.85rem; font-weight: bold; color: #495057; display: block; margin-bottom: 8px;">Tu código en PSeInt:</label>
            <input type="text" id="userInput" placeholder="Ej: (x + y) / 2" style="width: 100%; padding: 12px 15px; font-size: 1.1rem; border: 2px solid #ced4da; border-radius: 6px; font-family: 'Courier New', Courier, monospace; outline: none; transition: border-color 0.3s; box-sizing: border-box;" onkeypress="handleEnter(event)">
        </div>

        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <button onclick="checkAnswer()" style="background: #198754; color: white; border: none; padding: 10px 25px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s;">Verificar</button>
            <button id="nextBtn" onclick="nextQuestion()" style="background: #0d6efd; color: white; border: none; padding: 10px 25px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; display: none; transition: background 0.2s;">Siguiente Desafío ➔</button>
        </div>

        <div id="feedback-panel" style="width: 100%; margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: 500; text-align: center; box-sizing: border-box;">
        </div>
        
        <div style="margin-top: 25px; width: 100%; text-align: center; color: #adb5bd; font-size: 0.85rem; font-weight: bold;">
            Desafío <span id="current-q">1</span> de <span id="total-q">3</span>
        </div>

    </div>

    <style>
        input:focus { border-color: #0d6efd !important; }
        .success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    </style>

    <script>
        // Base de datos de ejercicios
        const questions = [
            {
                latex: "\\frac{x + y}{2} \\cdot h",
                validAnswers: ["(x+y)/2*h", "((x+y)/2)*h", "h*(x+y)/2"],
                hint: "Error. Recuerda que todo el numerador (x+y) debe resolverse antes de dividir, ¡usa paréntesis!"
            },
            {
                latex: "\\sqrt{a^2 + b^2}",
                validAnswers: ["rc(a^2+b^2)", "rc((a^2)+(b^2))"],
                hint: "Error. Recuerda usar la función interna RC() y agrupar todo el interior con paréntesis."
            },
            {
                latex: "\\frac{a}{b+c} - d",
                validAnswers: ["a/(b+c)-d", "(a/(b+c))-d"],
                hint: "Error. El denominador (b+c) debe ir entre paréntesis para que la suma ocurra antes que la división."
            },
            {
                latex: "\\frac{-b + \\sqrt{b^2 - 4ac}}{2a}",
                validAnswers: ["(-b+rc(b^2-4*a*c))/(2*a)", "(-b+rc(b^2-(4*a*c)))/(2*a)"],
                hint: "Error. Cuidado: Numerador completo entre paréntesis, denominador completo entre paréntesis, y los multiplicadores ocultos (4*a*c)."
            }
        ];

        let currentIndex = 0;

        function renderQuestion() {
            const display = document.getElementById('formula-display');
            const q = questions[currentIndex];
            // Usamos un generador de LaTeX a SVG externo gratuito y robusto
            display.innerHTML = `<img src="https://latex.codecogs.com/svg.latex?\\LARGE ${q.latex}" alt="Fórmula matemática">`;
            
            document.getElementById('userInput').value = '';
            document.getElementById('feedback-panel').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('current-q').innerText = currentIndex + 1;
            document.getElementById('total-q').innerText = questions.length;
            document.getElementById('userInput').focus();
        }

        function normalizeString(str) {
            // Elimina todos los espacios y pasa a minúsculas
            return str.replace(/\\s+/g, '').toLowerCase();
        }

        function checkAnswer() {
            const inputVal = document.getElementById('userInput').value;
            if(!inputVal) return;

            const normalizedInput = normalizeString(inputVal);
            const q = questions[currentIndex];
            
            // Verifica si el input coincide con alguna de las respuestas válidas
            const isCorrect = q.validAnswers.some(ans => normalizeString(ans) === normalizedInput);
            
            const panel = document.getElementById('feedback-panel');
            panel.style.display = 'block';

            if(isCorrect) {
                panel.className = 'success';
                panel.innerHTML = '¡Correcto! Has respetado perfectamente la jerarquía de operadores.';
                document.getElementById('nextBtn').style.display = currentIndex < questions.length - 1 ? 'inline-block' : 'none';
                if(currentIndex === questions.length - 1) {
                    panel.innerHTML += '<br><b>¡Laboratorio completado!</b>';
                }
            } else {
                panel.className = 'error';
                panel.innerHTML = q.hint;
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        }

        // Iniciar
        window.onload = renderQuestion;
    </script>
</div>

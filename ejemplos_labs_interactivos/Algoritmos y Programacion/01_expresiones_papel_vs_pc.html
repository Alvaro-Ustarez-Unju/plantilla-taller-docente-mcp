<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; background: #f8f9fa; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <div style="background: #003366; color: white; padding: 15px 20px; text-align: center;">
    <h3 style="margin: 0; font-size: 1.2rem; font-weight: 600;">Expresiones: Papel vs. Computadora</h3>
  </div>
  
  <div style="display: flex; flex-direction:column; flex-wrap: wrap; padding: 20px; gap: 20px;">
    <div style="flex: 1; min-width: 300px; background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px;">
      <h4 style="margin-top: 0; color: #495057; border-bottom: 2px solid #ffc107; padding-bottom: 5px;">Fórmula General (Raíz Positiva)</h4>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <div style="text-align: center; color: #212529;">
          <small style="color: #6c757d; font-weight: bold; display: block; margin-bottom: 5px;">En Papel</small>
          <img src="https://latex.codecogs.com/svg.latex?\frac{-b+\sqrt{b^2-4ac}}{2a}" alt="Fórmula cuadrática" style="height: 45px;">
        </div>
        <div style="font-size: 24px; color: #adb5bd;">➔</div>
        <div style="text-align: center;">
           <small style="color: #6c757d; font-weight: bold; display: block; margin-bottom: 5px;">En PSeInt</small>
           <code style="background: #e9ecef; color: #d63384; padding: 5px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem;">
            (-b + rc(b^2 - 4*a*c)) / (2*a)
           </code>
        </div>
      </div>
    </div>

    <div style="flex: 1; min-width: 300px; background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px;">
      <h4 style="margin-top: 0; color: #495057; border-bottom: 2px solid #ffc107; padding-bottom: 5px;">Promedio de 3 Notas</h4>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <div style="text-align: center; color: #212529;">
          <small style="color: #6c757d; font-weight: bold; display: block; margin-bottom: 5px;">En Papel</small>
          <img src="https://latex.codecogs.com/svg.latex?\frac{n_1+n_2+n_3}{3}" alt="Promedio" style="height: 40px;">
        </div>
        <div style="font-size: 24px; color: #adb5bd;">➔</div>
        <div style="text-align: center;">
           <small style="color: #6c757d; font-weight: bold; display: block; margin-bottom: 5px;">En PSeInt</small>
           <code style="background: #e9ecef; color: #d63384; padding: 5px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem;">
            (n1 + n2 + n3) / 3
           </code>
        </div>
      </div>
    </div>
  </div>
</div>

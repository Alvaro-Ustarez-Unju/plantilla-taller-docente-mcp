<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --ayp-blue: #1565c0;
            --success: #2e7d32;
            --error: #d32f2f;
            --bg-gray: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: transparent;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .widget-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .header {
            background-color: var(--ayp-blue);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.2rem; }
        .header p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.9; }

        .content { padding: 20px; }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .note-input {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--ayp-blue); outline: none; }

        .results-panel {
            background: var(--bg-gray);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid #eee;
        }

        .promedio-text {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .boolean-val {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 5px 0;
            color: #999;
        }

        .logic-box {
            background: #263238;
            color: #81d4fa;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-align: left;
            margin-top: 10px;
        }

        .status-promociona { border-color: var(--success); background-color: #e8f5e9; color: var(--success); }
        .status-no-promociona { border-color: var(--error); background-color: #ffebee; color: var(--error); }
    </style>
</head>
<body>

<div class="widget-card">
    <div class="header">
        <h2>📊 Control de Promoción</h2>
        <p>Algoritmos y Programación - Facultad de Ingeniería</p>
    </div>

    <div class="content">
        <div class="notes-grid">
            <div class="note-input">
                <label>Parcial 1</label>
                <input type="number" id="n1" min="0" max="10" step="0.5" placeholder="0" oninput="evaluarPromocion()">
            </div>
            <div class="note-input">
                <label>Parcial 2</label>
                <input type="number" id="n2" min="0" max="10" step="0.5" placeholder="0" oninput="evaluarPromocion()">
            </div>
            <div class="note-input">
                <label>Parcial 3</label>
                <input type="number" id="n3" min="0" max="10" step="0.5" placeholder="0" oninput="evaluarPromocion()">
            </div>
        </div>

        <div id="panel" class="results-panel">
            <div class="promedio-text">Promedio: <strong id="promVal">0.00</strong></div>
            <div style="font-size: 0.7rem; text-transform: uppercase; color: #777;">¿Promociona?</div>
            <div id="boolRes" class="boolean-val">---</div>

            <div class="logic-box">
                (prom >= 7.0) && (n1 >= 6) && (n2 >= 6) && (n3 >= 6)
                <br>
                <span style="color: #cfd8dc;">// Resultado: </span><span id="rawRes" style="color: #ffb74d;">?</span>
            </div>
        </div>
    </div>
</div>

<script>
    function evaluarPromocion() {
        const n1 = parseFloat(document.getElementById('n1').value) || 0;
        const n2 = parseFloat(document.getElementById('n2').value) || 0;
        const n3 = parseFloat(document.getElementById('n3').value) || 0;
        
        const promVal = document.getElementById('promVal');
        const boolRes = document.getElementById('boolRes');
        const rawRes = document.getElementById('rawRes');
        const panel = document.getElementById('panel');

        // Cálculo del promedio
        const promedio = (n1 + n2 + n3) / 3;
        promVal.innerText = promedio.toFixed(2);

        // --- LÓGICA DE PROMOCIÓN ---
        // Se deben cumplir todas las condiciones: promedio Y notas individuales
        const promociona = (promedio >= 7.0) && (n1 >= 6.0) && (n2 >= 6.0) && (n3 >= 6.0);

        if (promociona) {
            boolRes.innerText = "VERDADERO";
            rawRes.innerText = "true";
            panel.className = "results-panel status-promociona";
        } else {
            boolRes.innerText = "FALSO";
            rawRes.innerText = "false";
            panel.className = "results-panel status-no-promociona";
        }
    }
</script>

</body>
</html>

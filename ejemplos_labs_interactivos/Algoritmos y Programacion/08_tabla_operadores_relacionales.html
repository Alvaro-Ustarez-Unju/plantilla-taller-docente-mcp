<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 10px; overflow: hidden; border: 1px solid #dee2e6; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <div style="background: #6f42c1; color: white; padding: 15px 20px; text-align: center;">
    <h3 style="margin: 0; font-size: 1.2rem; font-weight: 600;">Operadores Relacionales en PSeInt</h3>
  </div>
  
  <div style="padding: 20px; background-color: #f8f9fa;">
    <table style="width: 100%; border-collapse: collapse; text-align: left; background: white; border-radius: 8px; overflow: hidden;">
      <thead>
        <tr style="background-color: #e9ecef; color: #495057;">
          <th style="padding: 12px 15px; border-bottom: 2px solid #dee2e6;">Símbolo</th>
          <th style="padding: 12px 15px; border-bottom: 2px solid #dee2e6;">Significado</th>
          <th style="padding: 12px 15px; border-bottom: 2px solid #dee2e6;">Ejemplo</th>
          <th style="padding: 12px 15px; border-bottom: 2px solid #dee2e6;">Resultado de la PC</th>
        </tr>
      </thead>
      <tbody>
        <tr style="border-bottom: 1px solid #dee2e6;">
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">&gt;</td>
          <td style="padding: 12px 15px;">Mayor que</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">10 &gt; 5</code></td>
          <td style="padding: 12px 15px; color: #198754; font-weight: bold;">VERDADERO</td>
        </tr>
        <tr style="border-bottom: 1px solid #dee2e6;">
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">&lt;</td>
          <td style="padding: 12px 15px;">Menor que</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">10 &lt; 5</code></td>
          <td style="padding: 12px 15px; color: #dc3545; font-weight: bold;">FALSO</td>
        </tr>
        <tr style="border-bottom: 1px solid #dee2e6;">
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">==</td>
          <td style="padding: 12px 15px;">Igual a</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">8 = 8</code></td>
          <td style="padding: 12px 15px; color: #198754; font-weight: bold;">VERDADERO</td>
        </tr>
        <tr style="border-bottom: 1px solid #dee2e6;">
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">!=</td>
          <td style="padding: 12px 15px;">Distinto de</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">8 &lt;&gt; 8</code></td>
          <td style="padding: 12px 15px; color: #dc3545; font-weight: bold;">FALSO</td>
        </tr>
        <tr style="border-bottom: 1px solid #dee2e6;">
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">&gt;=</td>
          <td style="padding: 12px 15px;">Mayor o igual</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">7 &gt;= 7</code></td>
          <td style="padding: 12px 15px; color: #198754; font-weight: bold;">VERDADERO</td>
        </tr>
        <tr>
          <td style="padding: 12px 15px; font-weight: bold; font-size: 1.2rem; color: #6f42c1;">&lt;=</td>
          <td style="padding: 12px 15px;">Menor o igual</td>
          <td style="padding: 12px 15px;"><code style="background: #f1f3f5; padding: 2px 6px; border-radius: 4px;">4 &lt;= 2</code></td>
          <td style="padding: 12px 15px; color: #dc3545; font-weight: bold;">FALSO</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #9b59b6;
            --success: #27ae60;
            --error: #e74c3c;
            --bg-light: #f8f9fa;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            background: #ffffff;
            color: var(--primary);
        }

        .widget-container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: var(--bg-light);
        }

        h3 { 
            margin-top: 0; 
            text-align: center; 
            color: var(--primary); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            padding: 15px;
            border: 2px solid #34495e;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            line-height: 1.5;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover { background: #8e44ad; }
        button:active { transform: scale(0.98); }

        .results-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rule-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            transition: all 0.3s;
        }

        .rule-icon {
            font-size: 1.5em;
            line-height: 1;
        }

        .rule-content h4 {
            margin: 0 0 5px 0;
            font-size: 1em;
        }

        .rule-content p {
            margin: 0;
            font-size: 0.85em;
            color: #555;
        }

        /* Estados de las tarjetas */
        .status-pass { border-color: var(--success); background: #f0fdf4; }
        .status-pass .rule-content h4 { color: var(--success); }
        
        .status-fail { border-color: var(--error); background: #fef2f2; }
        .status-fail .rule-content h4 { color: var(--error); }

    </style>
</head>
<body>

<div class="widget-container">
    <h3>👨‍💻 Tech Lead: Auditor de Funciones</h3>
    
    <div class="controls">
        <select id="selectorEscenario" onchange="cargarEscenario()">
            <option value="perfecta">✅ Función Perfecta (Cumple todo)</option>
            <option value="habladora">❌ Función Habladora (Falla Regla 1: Tiene un Escribir)</option>
            <option value="olvidadiza">❌ Función Olvidadiza (Falla Regla 2: No devuelve nada)</option>
        </select>
        
        <textarea id="editorCodigo" spellcheck="false"></textarea>
        
        <button onclick="auditarCodigo()">🔍 Auditar Código</button>
    </div>

    <div class="results-panel">
        <div class="rule-card" id="cardRegla1">
            <div class="rule-icon" id="iconRegla1">⏳</div>
            <div class="rule-content">
                <h4>Regla 1: Módulo Sordo y Mudo (Cero I/O)</h4>
                <p id="msgRegla1">Esperando auditoría... La función no debe contener comandos Leer ni Escribir.</p>
            </div>
        </div>

        <div class="rule-card" id="cardRegla2">
            <div class="rule-icon" id="iconRegla2">⏳</div>
            <div class="rule-content">
                <h4>Regla 2: Valor Retornado</h4>
                <p id="msgRegla2">Esperando auditoría... La variable definida en el encabezado debe recibir un valor.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const escenarios = {
        perfecta: `Funcion resultado = CalcularDescuento(precio, porcentaje)
    Definir resultado Como Real
    resultado = precio - (precio * porcentaje / 100)
FinFuncion`,
        
        habladora: `Funcion total = CalcularSuma(a, b)
    Definir total Como Entero
    Escribir "Iniciando cálculo matemático..." // ❌ MAL: Cero I/O
    total = a + b
FinFuncion`,
        
        olvidadiza: `Funcion miVariableRetorno = MultiplicarNumeros(x, y)
    Definir calculo Como Entero
    calculo = x * y
    // ❌ MAL: 'miVariableRetorno' nunca recibe el resultado
FinFuncion`
    };

    function cargarEscenario() {
        const seleccion = document.getElementById('selectorEscenario').value;
        document.getElementById('editorCodigo').value = escenarios[seleccion];
        resetearPaneles();
    }

    function resetearPaneles() {
        document.getElementById('cardRegla1').className = "rule-card";
        document.getElementById('iconRegla1').textContent = "⏳";
        document.getElementById('msgRegla1').textContent = "Esperando auditoría... La función no debe contener comandos Leer ni Escribir.";

        document.getElementById('cardRegla2').className = "rule-card";
        document.getElementById('iconRegla2').textContent = "⏳";
        document.getElementById('msgRegla2').textContent = "Esperando auditoría... La variable definida en el encabezado debe recibir un valor.";
    }

    function auditarCodigo() {
        const codigo = document.getElementById('editorCodigo').value;
        
        // Elementos UI Regla 1
        const card1 = document.getElementById('cardRegla1');
        const icon1 = document.getElementById('iconRegla1');
        const msg1 = document.getElementById('msgRegla1');
        
        // Elementos UI Regla 2
        const card2 = document.getElementById('cardRegla2');
        const icon2 = document.getElementById('iconRegla2');
        const msg2 = document.getElementById('msgRegla2');

        // --- VALIDACIÓN REGLA 1: Cero I/O ---
        // Buscamos palabras Escribir o Leer (ignorando mayúsculas/minúsculas)
        const tieneIO = /\b(Escribir|Leer)\b/i.test(codigo);
        
        if (tieneIO) {
            card1.className = "rule-card status-fail";
            icon1.textContent = "❌";
            msg1.textContent = "¡Error Crítico! Hemos detectado un comando 'Escribir' o 'Leer'. El Obrero Calculador debe trabajar en silencio.";
        } else {
            card1.className = "rule-card status-pass";
            icon1.textContent = "✅";
            msg1.textContent = "¡Excelente! La función es totalmente pura y no interactúa con el usuario.";
        }

        // --- VALIDACIÓN REGLA 2: Retorno Asignado ---
        let pasaRegla2 = false;
        
        // 1. Extraemos el nombre de la variable de retorno del encabezado
        // Busca "Funcion variable =" o "Funcion variable <-"
        const matchEncabezado = codigo.match(/Funcion\s+([a-zA-Z0-9_]+)\s*(?:=|<-)/i);
        
        if (matchEncabezado) {
            const varRetorno = matchEncabezado[1];
            
            // 2. Verificamos si esa variable se le asigna un valor (variable = ... o variable <- ...)
            // Ignoramos la primera línea para no confundir con el encabezado
            const lineas = codigo.split('\n').slice(1);
            const regexAsignacion = new RegExp(`\\b${varRetorno}\\s*(=|<-)`, 'i');
            
            for (let linea of lineas) {
                if (regexAsignacion.test(linea)) {
                    pasaRegla2 = true;
                    break;
                }
            }

            if (pasaRegla2) {
                card2.className = "rule-card status-pass";
                icon2.textContent = "✅";
                msg2.textContent = `¡Perfecto! La variable mochila '${varRetorno}' fue empaquetada correctamente con un valor antes de terminar.`;
            } else {
                card2.className = "rule-card status-fail";
                icon2.textContent = "❌";
                msg2.textContent = `¡Cuidado! Declaraste '${varRetorno}' en el encabezado, pero llegaste al FinFuncion sin asignarle ningún valor. ¡El Jefe recibirá una mochila vacía!`;
            }
        } else {
            card2.className = "rule-card status-fail";
            icon2.textContent = "⚠️";
            msg2.textContent = "Error de sintaxis. No se encontró un encabezado válido. Usa el formato: 'Funcion variable = Nombre()'";
        }
    }

    // Inicializar al cargar la página
    window.onload = cargarEscenario;
</script>

</body>
</html>

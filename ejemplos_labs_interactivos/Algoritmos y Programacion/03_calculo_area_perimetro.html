<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #1976d2;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.4rem;
        }

        .header p {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-calcular {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-calcular:hover {
            background-color: #1b5e20;
        }

        .btn-calcular:active {
            transform: scale(0.98);
        }

        .results-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ccc;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .val-label { font-weight: 500; color: #555; }
        .val-result { font-weight: bold; color: var(--secondary-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .formula-hint {
            font-size: 0.9rem;
            color: #777;
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .formula-hint span {
            display: inline-block;
            margin: 0 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header">
        <h2>Plaza Belgrano: Renovación</h2>
        <p>Cálculo de materiales para la glorieta</p>
    </div>

    <div class="input-group">
        <label for="radio">Radio de la glorieta (metros):</label>
        <input type="number" id="radio" placeholder="Ej: 5.5" step="0.1" min="0">
    </div>

    <button class="btn-calcular" onclick="ejecutarAlgoritmo()">Calcular Dimensiones</button>

    <div id="panel-resultados" class="results-panel">
        <div class="result-item">
            <span class="val-label">Área (Baldosas):</span>
            <span id="res-area" class="val-result">0</span>
        </div>
        <div class="result-item">
            <span class="val-label">Perímetro (Borde):</span>
            <span id="res-perimetro" class="val-result">0</span>
        </div>
    </div>

    <div class="formula-hint">
        <span>A = π · r²</span>  |  <span>P = 2 · π · r</span>
    </div>
</div>

<script>
    function ejecutarAlgoritmo() {
        const radioInput = document.getElementById('radio');
        const r = parseFloat(radioInput.value);

        if (isNaN(r) || r <= 0) {
            alert("Por favor, ingresa un radio válido mayor a 0.");
            return;
        }

        const PI = Math.PI;
        // Uso de Math.pow para asegurar compatibilidad total o r * r
        const area = PI * Math.pow(r, 2);
        const perimetro = 2 * PI * r;

        document.getElementById('res-area').innerText = area.toFixed(2) + " m²";
        document.getElementById('res-perimetro').innerText = perimetro.toFixed(2) + " m";

        const panel = document.getElementById('panel-resultados');
        panel.style.display = 'block';
    }
</script>

</body>
</html>
